# Push a tag like v0.1.0, or run it by hand (Actions → Release → Run workflow: the tag is made from
# versionName) → tests, then the APK, published as a GitHub Release.
# Signed with the Theta Hatch series key from the secrets ANDROID_KEYSTORE_B64 /
# ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD (required).
# 0.1.x (old ID, development key) was the migration bridge; its last version is the tag v0.1.1.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - id: v
        name: Version
        run: |
          v="$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" android/app/build.gradle)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "${GITHUB_REF_NAME#v}" = "$v"; fi
          test -f "docs/releases/v$v.md"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Tests (logic and screen)
        run: |
          node --test test/core.test.js
          npm install -g playwright@1.56.1
          npx playwright install --with-deps chromium
          NODE_PATH="$(npm root -g)" node test/ui.e2e.cjs
      - name: APK (signed with the series key)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS are not set"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export SIGNING_FILE="$RUNNER_TEMP/release.jks" SIGNING_PASSWORD="$KEYSTORE_PASSWORD" SIGNING_ALIAS="$KEY_ALIAS" SIGNING_KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          (cd android && ./gradlew :app:assembleRelease --no-daemon)
          rm -f "$RUNNER_TEMP/release.jks"
          apk=android/app/build/outputs/apk/release/app-release.apk
          # The series key (Theta.Hatch.Series secrets/README.md)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | tee certs.txt
          grep -qi "SHA-1 digest: a113ea3483605632e7f5944e4e8c2055ddae28ba" certs.txt
          cp "$apk" "ThetaChirashiHatch-${{ steps.v.outputs.version }}.apk"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.v.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" ThetaChirashiHatch-*.apk --clobber
          else
            gh release create "$TAG" ThetaChirashiHatch-*.apk --target "$GITHUB_SHA" \
              --title "Theta Chirashi Hatch ${{ steps.v.outputs.version }}" --notes-file "docs/releases/$TAG.md"
          fi
