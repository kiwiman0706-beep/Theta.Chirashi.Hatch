# Push a tag like v0.1.0, or run it by hand (Actions → Release → Run workflow: the tag is made from
# versionName) → tests, then the APK, published as a GitHub Release.
# Signed with the repository secrets ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD /
# ANDROID_KEY_ALIAS when set, otherwise with the development key in android/signing/.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - id: v
        name: Version
        run: |
          v="$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" android/app/build.gradle)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "${GITHUB_REF_NAME#v}" = "$v"; fi
          test -f "docs/releases/v$v.md"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Tests (logic and screen)
        run: |
          node --test test/core.test.js
          npm install -g playwright@1.56.1
          npx playwright install --with-deps chromium
          NODE_PATH="$(npm root -g)" node test/ui.e2e.cjs
      - name: APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export SIGNING_FILE="$RUNNER_TEMP/release.jks" SIGNING_PASSWORD="$KEYSTORE_PASSWORD" SIGNING_ALIAS="${KEY_ALIAS:-chirashi}"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          cd android && ./gradlew :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "../ThetaChirashiHatch-${{ steps.v.outputs.version }}.apk"
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.v.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" ThetaChirashiHatch-*.apk --clobber
          else
            gh release create "$TAG" ThetaChirashiHatch-*.apk --target "$GITHUB_SHA" \
              --title "Theta Chirashi Hatch ${{ steps.v.outputs.version }}" --notes-file "docs/releases/$TAG.md"
          fi
