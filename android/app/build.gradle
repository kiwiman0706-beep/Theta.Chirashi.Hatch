plugins { id 'com.android.application' }

// Signing: the Theta Hatch series key (Theta.Hatch.Series secrets/README.md), handed to the build
// by release.yml from the secrets ANDROID_KEYSTORE_B64 / _PASSWORD / ANDROID_KEY_ALIAS /
// ANDROID_KEY_PASSWORD as SIGNING_FILE / SIGNING_PASSWORD / SIGNING_ALIAS / SIGNING_KEY_PASSWORD.
// Without them (a local build) the APK gets the Android debug key: fine for trying the screen,
// but Google login only works with the series key (its SHA-1 is registered in Google Cloud).
def signFile = System.getenv('SIGNING_FILE')

android {
    namespace 'app.thetahatch.chirashi'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId 'app.thetahatch.chirashi'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.3.0'
    }
    signingConfigs {
        if (signFile) {
            series {
                storeFile file(signFile)
                storePassword System.getenv('SIGNING_PASSWORD')
                keyAlias System.getenv('SIGNING_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD') ?: System.getenv('SIGNING_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signFile ? signingConfigs.series : signingConfigs.debug
            minifyEnabled false
        }
    }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
    implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}
